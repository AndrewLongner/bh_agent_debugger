# Publishes the MSI of a GitHub release to the Visual Studio Marketplace listing
# BoilingLavaHotLLC.BHAgentDebugger with trusted publishing (GitHub OIDC): no token is stored.
#
# Needs a Trusted Publishing policy on the Marketplace publisher BoilingLavaHotLLC for owner
# AndrewLongner, repository bh_agent_debugger, workflow publish-marketplace.yml and environment
# marketplace. The marketplace environment holds each run until it is approved.
#
# Runs when a release is published, or by hand for an existing release:
#   gh workflow run publish-marketplace.yml -f tag=v1.0.2 [-f dry_run=true]
name: Publish to Visual Studio Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.2
        required: true
        type: string
      dry_run:
        description: Check and stage only; do not publish
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    environment: marketplace
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the release tag
        shell: powershell
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}$') { throw "Not a release tag: $env:RELEASE_TAG" }

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download the release MSI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern bh_agent_debugger.msi --dir Temp\installer
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE" }

      - name: Publish
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          $publisher = .\installer\get_vsixpublisher.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'vsixpublisher')
          $publishArgs = @{ Oidc = $true; VsixPublisherPath = $publisher; VerifyTimeoutSeconds = 1800 }
          if ($env:DRY_RUN -eq 'true') { $publishArgs.DryRun = $true }
          & .\installer\publish_marketplace.ps1 @publishArgs
          $code = $LASTEXITCODE
          if ($code -eq 2)
          {
            Write-Output "::warning::Uploaded $env:RELEASE_TAG, but the public Marketplace does not serve it yet. Rerun with dry_run=true later; it reports 'already published' once it is live."
            exit 0
          }
          exit $code
